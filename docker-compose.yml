services:
  backend:
    image: bienestar-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bienestar_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
    networks:
      - bienestar_network

  frontend:
    image: bienestar-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bienestar_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bienestar_network

networks:
  bienestar_network:
    driver: bridge

